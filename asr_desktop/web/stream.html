<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时转写 - Qwen3-ASR Service</title>
<script src="/web-ui/assets/vendor/vue-3.5.35.global.prod.js"></script>
<script src="/web-ui/assets/vendor/naive-ui-2.44.1.prod.js"></script>
<link rel="stylesheet" href="/web-ui/assets/app.css">
<style>
  /* Electron 外壳内嵌模式：隐藏上游自己的应用栏，交由外壳提供导航 */
  body.embed .appbar { display: none !important; }
  body.embed.app-fullh .container { height: 100vh !important; padding-top: 18px !important; padding-bottom: 18px !important; }
  body.embed::before { display: none; }
  body.embed { background-image: none; }
  /* 内嵌时不受 961px 断点影响：始终保持「左栏 + 右栏」满高布局，
     转写区自己滚动，长录音只滚右栏，早期内容不会被挤到视口外或被裁掉 */
  body.embed.app-fullh { overflow: hidden; }
  body.embed .page-flex { height: 100%; display: flex; flex-direction: column; min-height: 0; }
  body.embed .workspace { flex: 1; min-height: 0; flex-direction: row; align-items: stretch; }
  body.embed .side-col { flex: 0 0 clamp(248px, 34%, 340px); width: auto; max-height: 100%; overflow: auto; }
  body.embed .main-col { flex: 1; width: auto; height: 100%; min-width: 0; }
  body.embed .main-col .panel { height: 100%; display: flex; flex-direction: column; }
  body.embed .main-col .panel > .panel-body { flex: 1; min-height: 0; overflow: hidden; }
  body.embed #transcript { height: 100%; min-height: 0; overflow: auto; overscroll-behavior: contain; }
  /* 极窄窗口（< 720px）退回上下堆叠 + 文档流滚动，避免两栏挤压 */
  @media (max-width: 719px) {
    body.embed.app-fullh { overflow: auto; }
    body.embed.app-fullh .container { height: auto !important; min-height: 100vh !important; }
    body.embed .workspace { flex-direction: column; align-items: flex-start; }
    body.embed .side-col { flex: none; width: 100%; max-height: none; overflow: visible; }
    body.embed .main-col { height: auto; width: 100%; }
    body.embed .main-col .panel { height: auto; display: block; }
    body.embed .main-col .panel > .panel-body { overflow: visible; }
    body.embed #transcript { height: auto; max-height: none; overflow: visible; }
  }
</style>
<script>
  if (location.search.indexOf('embed=1') >= 0) {
    document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('embed'); });
  }
</script>
</head>
<body class="app-fullh">
<div id="app">
  <n-config-provider :theme="theme" :theme-overrides="themeOverrides" :locale="naiveLocale" :date-locale="naiveDateLocale">
    <n-global-style></n-global-style>
    <header class="appbar">
      <div class="appbar-inner">
        <a class="brand" href="/web-ui">
          <a-icon name="logo" size="20"></a-icon><span>Qwen3-ASR</span>
        </a>
        <nav class="appnav">
          <a href="/web-ui">{{ t('nav.offline') }}</a>
          <a href="/web-ui/stream" class="active">{{ t('nav.stream') }}</a>
          <a href="/web-ui/speakers">{{ t('nav.speakers') }}</a>
          <a :href="docsHref">{{ t('nav.docs') }}</a>
        </nav>
        <div class="appbar-right">
          <n-popover trigger="hover" placement="bottom-end">
            <template #trigger>
              <button class="iconbtn svc-host" :class="svc.cls" :title="t('model.title')">
                <a-icon name="chip"></a-icon><span class="svc-badge"></span>
              </button>
            </template>
            <div class="model-card">
              <div class="model-card-title">{{ t('model.title') }}</div>
              <div class="svc-line" :class="svc.cls"><span class="svc-badge"></span><span>{{ svcState }}</span></div>
              <template v-if="modelRows.length">
                <div v-for="r in modelRows" :key="r.label" class="model-row">
                  <span class="k">{{ r.label }}</span><span class="v" :class="r.cls">{{ r.value }}</span>
                </div>
              </template>
              <n-text v-else depth="3" style="font-size:.82em;">{{ t('model.unavailable') }}</n-text>
            </div>
          </n-popover>
          <span class="appbar-sep"></span>
          <n-popover trigger="click" placement="bottom-end">
            <template #trigger>
              <button class="iconbtn" :class="{ 'has-key': hasKey }" title="API Key"><a-icon name="key"></a-icon></button>
            </template>
            <div style="width:240px;">
              <n-text depth="3" style="display:block;font-size:.78em;margin-bottom:6px;">{{ t('key.hint') }}</n-text>
              <n-input v-model:value="apiKey" type="password" show-password-on="click" size="small" placeholder="sk-..."></n-input>
            </div>
          </n-popover>
          <button class="iconbtn lang-btn" :title="t('lang.title')" @click="toggleLang">{{ locale === 'zh' ? '中' : 'EN' }}</button>
          <button class="iconbtn" :title="themeLabel" @click="cycleTheme"><a-icon :name="themeIcon"></a-icon></button>
          <a class="iconbtn" href="/web-ui/settings" title="设置 / Settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </a>
        </div>
      </div>
    </header>
    <div class="container">
      <n-message-provider>
        <app-body></app-body>
      </n-message-provider>
    </div>
  </n-config-provider>
</div>
<script src="/web-ui/assets/common.js"></script>
<script src="/web-ui/assets/stream.js"></script>
</body>
</html>
